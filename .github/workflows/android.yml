name: Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build home.apk
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        id: sdk
        run: |
          set -euo pipefail
          # ubuntu-latest runners ship an Android SDK; prefer that over obsolete "tools" packages.
          if [ -z "${ANDROID_HOME:-}" ]; then
            if [ -d /usr/local/lib/android/sdk ]; then
              echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
              export ANDROID_HOME=/usr/local/lib/android/sdk
            elif [ -n "${ANDROID_SDK_ROOT:-}" ]; then
              echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
              export ANDROID_HOME="$ANDROID_SDK_ROOT"
            else
              echo "ANDROID_HOME not found on runner" >&2
              exit 1
            fi
          else
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          echo "Using ANDROID_HOME=$ANDROID_HOME"
          echo "home=$ANDROID_HOME" >> "$GITHUB_OUTPUT"

          # Find sdkmanager (cmdline-tools layout varies by runner image).
          SM=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -1 || true)
          if [ -z "$SM" ] && [ -x "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            SM="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          if [ -z "$SM" ]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            ls -la "$ANDROID_HOME" || true
            exit 1
          fi
          echo "sdkmanager=$SM" >> "$GITHUB_OUTPUT"
          echo "SDKMANAGER=$SM" >> "$GITHUB_ENV"

      - name: Install platform & build-tools
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/tmp/sdk-licenses.txt || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"

      - name: Build APK
        working-directory: launcher
        run: |
          set -euo pipefail
          export ANDROID_HOME ANDROID_SDK_ROOT="$ANDROID_HOME"
          bash ./build.sh
          test -f build/home.apk
          ls -lh build/home.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: home-apk
          path: launcher/build/home.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            launcher/build/home.apk \
            --clobber
