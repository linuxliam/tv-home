name: Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build home.apk
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform & build-tools
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Point build at SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          # Homebrew-style path expected by build.sh falls back; force SDK root.
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools/34.0.0"
          ls "$ANDROID_HOME/platforms/android-34/android.jar"

      - name: Build APK
        working-directory: launcher
        run: |
          set -euo pipefail
          # build.sh defaults ANDROID_HOME to Homebrew; override for CI.
          export ANDROID_HOME="${ANDROID_HOME}"
          bash ./build.sh
          test -f build/home.apk
          ls -lh build/home.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: home-apk
          path: launcher/build/home.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            launcher/build/home.apk \
            --clobber
